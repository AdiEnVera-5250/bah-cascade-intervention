[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bah-cascade-intervention"
version = "0.1.0.dev0"
description = "Crecimiento de redes con homofilia, intervenciones por fases y cascadas de umbral."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "networkx>=3.4",
    "pandas>=2.3",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bah_cascade"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
