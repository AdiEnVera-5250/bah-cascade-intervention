[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bah-cascade-intervention"
version = "0.1.0.dev0"
description = "Network growth with homophily, phased group interventions, and threshold cascades."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.1",
    "networkx>=3.4",
    "pandas>=2.3",
    "matplotlib>=3.10",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "pytest>=8.3",
    "ruff>=0.6",
    "scipy>=1.18.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bah_cascade"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
